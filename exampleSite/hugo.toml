# hugo server --themesDir ../..

title = 'Hudocs'
theme = 'hudocs'
baseURL = 'https://hudocs.com/'

enableRobotsTXT = true
enableInlineShortcodes = true
enableGitInfo = true
disableKinds = ["taxonomy", "term", "RSS"]
summaryLength = 20

[languages]
  [languages.en]
    label = "English"
    weight = 1
    [languages.en.menu]
      [[languages.en.menu.main]]
        name = "Documentation"
        url = "/docs/"
        weight = 1
      [[languages.en.menu.main]]
        name = "GitHub"
        url = "https://github.com/zkreations/hudocs"
        weight = 2
  [languages.es]
    label = "Español"
    weight = 2
    [languages.es.menu]
      [[languages.es.menu.main]]
        name = "Documentación"
        url = "/docs/"
        weight = 1
      [[languages.es.menu.main]]
        name = "GitHub"
        url = "https://github.com/zkreations/hudocs"
        weight = 2

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  description = "A Hugo theme for documentation sites"
  github_repo_edit = "https://github.com/zkreations/hudocs/tree/main/exampleSite/content"
  date_format = "January 2, 2006"
  copyright = "Created by [@zkreations](https://zkreations.com)"

  [params.docs]
    section = "docs"
    default_version = "latest"
    versions = ["latest", "1.8", "1.0"]