# hugo server --themesDir ../..

title = 'Hudocs'
theme = 'hudocs'
baseURL = 'https://hudocs.com/'

enableRobotsTXT = true
enableInlineShortcodes = true
enableGitInfo = true
disableKinds = ["taxonomy", "term"]
summaryLength = 20

[languages]
  [languages.en]
    label = "English"
    weight = 1

  [languages.es]
    label = "Español"
    weight = 2

[menus]
  [[menus.main]]
    pageRef = "/posts"
    weight = 1

  [[menus.main]]
    pageRef = "/docs"
    weight = 2

  [[menus.main]]
    pageRef = "/about"
    weight = 3

  [[menus.main]]
    name = "GitHub"
    url = "https://github.com/zkreations/hudocs"
    weight = 4
    [menus.main.params]
      icon = "github"

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  # Site
  # Global description used for metadata and the homepage.
  description = "A Hugo theme for documentation sites"

  # If true, the first image in a page will be loaded eagerly. Default: true
  # imageFirstEager = true 

  # Branding
  # Header icon from Meteor Icons. Default: "book-open"
  # brand_icon = "book-open"

  # Header logo. Replaces the icon and title.
  # brand_logo = "logo.svg"

  # Documentation
  # Documentation section. Default: "docs"
  # docs_section = "docs"

  # Version switcher. Auto-detected if omitted; set to false to disable.
  # docs_versions = ["latest", "1.8", "1.0"]

  # Expand all sections in the sidebar. Default: false
  # docs_expand_tree = true

  # Previous/next page navigation. Default: true
  # docs_pagination = false

  # Repository URL for the "Edit this page" button.
  docs_edit_url = "https://github.com/zkreations/hudocs/tree/main/exampleSite/content"

  # AI Assistant Actions. Default: true
  # docs_ai = false
  # docs_chatgpt = false
  # docs_claude = false

  # Default badge text. Default: "New" (i18n)
  # docs_badge_text = "Beta"

  # Default badge URL.
  # docs_badge_url = "https://example.com"

  # Code blocks
  # Code theme. Default: "duotone-dark"
  # Available: duotone-dark, duotone-dark-sky, duotone-dark-sea,
  #            duotone-dark-space, duotone-dark-earth, duotone-dark-forest
  # code_theme = "duotone-dark"

  # Posts
  # Number of posts per page. Default: 10
  # posts_paginate = 10

  # Footer
  # Last modified date format. Default: "2006-01-02"
  footer_date_format = "January 2, 2006"

  # Copyright text. Supports Markdown and {{Year}}.
  footer_copyright = "Created by [@zkreations](https://zkreations.com)"