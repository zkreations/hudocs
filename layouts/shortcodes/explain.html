{{- if not (and .Parent (eq .Parent.Name "annotated")) -}}
  {{- errorf "%s: The 'explain' shortcode must be called inside 'annotated'." .Position -}}
{{- else -}}
  {{- $class := .Get "class" | default (.Get 0) -}}
  <div class="annotated-note{{ with $class }} {{ . }}{{ end }}">
    {{- .Page.RenderString .Inner -}}
  </div>
{{- end -}}
