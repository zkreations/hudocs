<!doctype html>
<html lang="{{ .Site.Language.Lang }}">
  <head>
    {{ partial "head" . }}
    {{ partial "seo" . }}
    {{ partial "styles" . }}
    {{ partial "scripts" . }}
  </head>
  <body class="fs-7 fw-400">
    <div class="template flex column">
      <header class="header">
        {{ partial "header" . }}
      </header>
      {{ block "main" . }}{{ end }}
    </div>
    {{ partial "search" . }}
  </body>
</html>
